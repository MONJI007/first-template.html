<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple d'arrière-plan vidéo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .video-background-container {
            position: relative;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
        }

        .content-overlay {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: white;
            font-family: 'Arial', sans-serif;
        }

        .content-overlay h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .content-overlay p {
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
            margin-bottom: 0.5rem;
        }

        /* Style responsive */
        @media (max-width: 768px) {
            .content-overlay {
                padding: 2rem;
                margin: 1rem;
            }
            
            .content-overlay h1 {
                font-size: 2rem;
            }
            
            .content-overlay p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="video-background-container">
        <!-- Vidéo d'arrière-plan -->
        <video class="background-video" autoplay muted loop playsinline>
            <!-- Vidéo d'exemple en ligne (remplacez par votre propre vidéo) -->
            <source src="https://sample-videos.com/zip/10/mp4/SampleVideo_1280x720_1mb.mp4" type="video/mp4">
            <!-- Fallback pour les navigateurs qui ne supportent pas la vidéo -->
            <div style="background: linear-gradient(45deg, #667eea 0%, #764ba2 100%); position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
        </video>
        
        <!-- Contenu par-dessus la vidéo -->
        <div class="content-overlay">
            <h1>Arrière-plan Vidéo</h1>
            <p>Voici un exemple d'arrière-plan vidéo</p>
            <p>Le contenu est affiché par-dessus la vidéo</p>
            <p>avec un effet de flou et de transparence</p>
        </div>
    </div>
</body>
</html>
